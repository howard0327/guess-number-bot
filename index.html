<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼 - 程式猜數字版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <div id="intro">
        <h1>終極密碼</h1>
        <p class="subtitle">程式猜數字版</p>
        <p class="description">
            請在心中想一個數字，程式會嘗試猜出來。<br>
            你最多可以說謊一次。
        </p>
        <button class="mainButton" onclick="showMenu()">開始遊戲</button>
    </div>

    <div id="menu" style="display:none;">
        <h1>選擇範圍</h1>

        <button class="rangeButton" onclick="startGame(20)">0 ~ 20</button>
        <button class="rangeButton" onclick="startGame(50)">0 ~ 50</button>
        <button class="rangeButton" onclick="startGame(100)">0 ~ 100</button>
        <button class="rangeButton" onclick="startGame(200)">0 ~ 200</button>
    </div>

    <div id="game" style="display:none;">

        <h1>程式猜數字</h1>

        <p id="rangeText"></p>
        <p id="countText">第 0 步</p>

        <div class="guessBox">
            <p>程式猜：</p>
            <div id="guess">?</div>
        </div>

        <div id="answerButtons">
            <button onclick="answer(1)">答案比較大</button>
            <button onclick="answer(2)">答案比較小</button>
            <button onclick="answer(3)">猜中了</button>
        </div>

        <div id="end" style="display:none;">
            <h2>遊戲結束</h2>
            <p id="endText"></p>
            <button class="mainButton" onclick="restartGame()">重新開始</button>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
