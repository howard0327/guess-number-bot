<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終極密碼 - 程式猜數字版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <h1>終極密碼</h1>
    <p>程式猜數字</p>

    <h2>選擇範圍</h2>

    <button>0 ~ 20</button>
    <button>0 ~ 50</button>
    <button>0 ~ 100</button>
    <button>0 ~ 200</button>

    <hr>

    <h2>目前猜測</h2>
    <p id="guess">尚未開始</p>

    <button>答案比較大</button>
    <button>答案比較小</button>
    <button>猜中了</button>

    <p>猜測次數：<span id="count">0</span></p>

    <p id="status">請選擇範圍開始遊戲</p>

</div>

</body>
</html>
